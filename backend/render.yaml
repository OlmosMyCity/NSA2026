# Render Blueprint: API (plan gratuito). La base de datos es el PostgreSQL de Supabase.
# Render → New → Blueprint → seleccionar este repositorio.
services:
  - type: web
    name: artemis-iv-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Supabase → Connect → "Transaction pooler" (puerto 6543) + `?pgbouncer=true`
      - key: DATABASE_URL
        sync: false
      # Supabase → Connect → "Session pooler" (puerto 5432). Render no tiene IPv6: no usar db.<ref>.supabase.co
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: ALLOWED_ORIGINS
        value: https://orbvital-nsa2026.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: artemis-assets
