[project]
name = "astronaut-vitals"
version = "0.1.0"
description = "Lightweight open-source biometric monitoring for astronauts: Mood/Stress, Sleep Quality/Fatigue, and Multi-camera rPPG Heart Rate (BPM/HRV)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "opencv-python-headless>=4.9.0",
    "mediapipe>=0.10.14",
    "onnxruntime>=1.18.0",
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.12.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
